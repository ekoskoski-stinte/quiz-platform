services:
  # ── Backend: Django REST API ──────────────────────────────────────────────
  - type: web
    name: quiz-platform-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: quiz-platform-db
          property: connectionString
      - key: OPENAI_API_KEY
        value: stub

  # ── Frontend: React SPA ───────────────────────────────────────────────────
  - type: web
    name: quiz-platform-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://quiz-platform-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: quiz-platform-db
    databaseName: quiz_platform
    user: quiz_user
    plan: free